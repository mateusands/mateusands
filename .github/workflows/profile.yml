name: profile

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["profile/**"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

env:
  CARD: bg_color=0d0d0d&title_color=ffffff&text_color=c9c9c9&icon_color=ffffff&ring_color=ffffff&border_color=262626

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=mateusands&show_icons=true&include_all_commits=true&custom_title=GitHub%20Stats&${{ env.CARD }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=mateusands&layout=compact&langs_count=8&custom_title=Top%20Languages&${{ env.CARD }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Activity graph
        run: python3 scripts/activity.py profile/activity.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trophies
        run: python3 scripts/trophy.py profile/trophy.svg
        continue-on-error: true

      - name: Snake
        uses: Platane/snk@v3
        with:
          github_user_name: mateusands
          outputs: |
            profile/snake-light.svg?color_snake=#000000&color_dots=#ebedf0,#c4c4c4,#8a8a8a,#4d4d4d,#1a1a1a
            profile/snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161616,#3d3d3d,#6b6b6b,#a3a3a3,#ffffff

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git diff --cached --quiet && exit 0
          git commit -m "chore: update profile cards"
          git push
